<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>TV Remote</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
  <!-- Pairing Screen -->
  <div id="pairing-screen" class="screen active">
    <div class="glass-panel">
      <h1>Connect to TV</h1>
      <p>Scan for TVs on your network</p>
      
      <button id="scan-btn" class="secondary-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width: 18px; height: 18px; vertical-align: middle; margin-right: 8px; margin-bottom: 2px;"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        Scan for TVs
      </button>

      <div id="scan-results" style="display: none; margin-top: 15px; text-align: left;">
        <ul id="tv-list" style="list-style: none; padding: 0; margin: 0;"></ul>
      </div>

      <div style="margin: 20px 0; font-size: 12px; color: var(--text-secondary); text-align: center; border-bottom: 1px solid rgba(255,255,255,0.1); line-height: 0.1em;">
         <span style="background: var(--glass-bg); padding: 0 10px; border-radius: 10px;">OR</span>
      </div>

      <input type="text" id="ip-input" placeholder="e.g. 192.168.1.15" value="192.168.1.">
      <button id="connect-btn">Connect</button>
      
      <div id="pin-section" style="display: none;">
        <p>Enter the PIN shown on your TV</p>
        <input type="text" id="pin-input" placeholder="PIN" maxlength="6">
        <button id="pair-btn">Pair</button>
      </div>
      
      <div id="pairing-status"></div>
    </div>
  </div>

  <!-- Remote Screen -->
  <div id="remote-screen" class="screen">
    <div class="remote-header">
      <div class="tv-status">
        <span class="status-dot connected"></span> Connected
      </div>
      <button class="btn round power-btn" data-key="POWER">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18.36 6.64a9 9 0 1 1-12.73 0"></path><line x1="12" y1="2" x2="12" y2="12"></line></svg>
      </button>
    </div>

    <div class="dpad-container">
      <button class="btn dpad up" data-key="DPAD_UP">
         <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="18 15 12 9 6 15"></polyline></svg>
      </button>
      <button class="btn dpad right" data-key="DPAD_RIGHT">
         <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"></polyline></svg>
      </button>
      <button class="btn center ok" data-key="DPAD_CENTER">OK</button>
      <button class="btn dpad left" data-key="DPAD_LEFT">
         <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"></polyline></svg>
      </button>
      <button class="btn dpad down" data-key="DPAD_DOWN">
         <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"></polyline></svg>
      </button>
    </div>

    <div class="action-buttons">
      <button class="btn pill" data-key="BACK">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        Back
      </button>
      <button class="btn pill" data-key="HOME">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
        Home
      </button>
    </div>

    <div class="action-buttons" style="margin-top: 10px;">
      <button class="btn pill" data-key="SETTINGS">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
        Menu
      </button>
      <button class="btn pill" data-key="TV_INPUT">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="7" width="20" height="15" rx="2" ry="2"></rect><polyline points="17 2 12 7 7 2"></polyline></svg>
        Input
      </button>
    </div>

    <div class="volume-container">
      <button class="btn pill vol" data-key="VOLUME_DOWN">-</button>
      <button class="btn pill vol" data-key="VOLUME_MUTE" style="flex: 1; margin: 0 10px;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width: 18px; margin: auto;"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><line x1="23" y1="9" x2="17" y2="15"></line><line x1="17" y1="9" x2="23" y2="15"></line></svg>
      </button>
      <button class="btn pill vol" data-key="VOLUME_UP">+</button>
    </div>

    <div id="keyboard-container" style="margin-top: 20px;">
      <button class="btn pill" id="toggle-keyboard-btn" style="width: 100%;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width: 18px; margin-right: 8px; vertical-align: middle;"><rect x="2" y="4" width="20" height="16" rx="2" ry="2"></rect><line x1="6" y1="8" x2="6.01" y2="8"></line><line x1="10" y1="8" x2="10.01" y2="8"></line><line x1="14" y1="8" x2="14.01" y2="8"></line><line x1="18" y1="8" x2="18.01" y2="8"></line><line x1="8" y1="12" x2="8.01" y2="12"></line><line x1="12" y1="12" x2="12.01" y2="12"></line><line x1="16" y1="12" x2="16.01" y2="12"></line><line x1="7" y1="16" x2="17" y2="16"></line></svg>
        Keyboard Input
      </button>
      <div id="keyboard-input-wrapper" style="display: none; margin-top: 10px; gap: 8px;">
        <input type="text" id="keyboard-input" placeholder="Type text to TV..." style="flex: 1; border-radius: 8px; border: 1px solid rgba(255,255,255,0.2); background: rgba(0,0,0,0.2); color: #fff; padding: 10px; font-size: 16px;">
        <button id="send-text-btn" class="btn pill" style="width: auto; padding: 0 20px; background: var(--accent);">Send</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
