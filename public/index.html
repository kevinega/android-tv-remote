<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>TV Remote</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
  <!-- Pairing Screen -->
  <div id="pairing-screen" class="screen active">
    <div class="glass-panel">
      <h1>Connect to TV</h1>
      <p>Enter your Android TV's IP address</p>
      <input type="text" id="ip-input" placeholder="e.g. 192.168.1.15" value="192.168.1.">
      <button id="connect-btn">Connect</button>
      
      <div id="pin-section" style="display: none;">
        <p>Enter the PIN shown on your TV</p>
        <input type="text" id="pin-input" placeholder="PIN" maxlength="6">
        <button id="pair-btn">Pair</button>
      </div>
      
      <div id="pairing-status"></div>
    </div>
  </div>

  <!-- Remote Screen -->
  <div id="remote-screen" class="screen">
    <div class="remote-header">
      <div class="tv-status">
        <span class="status-dot connected"></span> Connected
      </div>
      <button class="btn round power-btn" data-key="POWER">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18.36 6.64a9 9 0 1 1-12.73 0"></path><line x1="12" y1="2" x2="12" y2="12"></line></svg>
      </button>
    </div>

    <div class="dpad-container">
      <button class="btn dpad up" data-key="DPAD_UP">
         <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="18 15 12 9 6 15"></polyline></svg>
      </button>
      <button class="btn dpad right" data-key="DPAD_RIGHT">
         <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"></polyline></svg>
      </button>
      <button class="btn center ok" data-key="DPAD_CENTER">OK</button>
      <button class="btn dpad left" data-key="DPAD_LEFT">
         <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"></polyline></svg>
      </button>
      <button class="btn dpad down" data-key="DPAD_DOWN">
         <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"></polyline></svg>
      </button>
    </div>

    <div class="action-buttons">
      <button class="btn pill" data-key="BACK">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        Back
      </button>
      <button class="btn pill" data-key="HOME">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
        Home
      </button>
    </div>

    <div class="volume-container">
      <button class="btn pill vol" data-key="VOLUME_DOWN">-</button>
      <span class="vol-label">VOL</span>
      <button class="btn pill vol" data-key="VOLUME_UP">+</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
